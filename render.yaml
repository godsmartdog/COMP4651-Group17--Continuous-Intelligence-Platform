services:
  - type: web
    name: gitpulse-api
    runtime: docker
    dockerfilePath: ./2_backend_api/Dockerfile
    dockerContext: ./2_backend_api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gitpulse-db
          property: connectionString

databases:
  - name: gitpulse-db
    plan: free
    databaseName: gitpulse_catalog
    user: gitpulse
